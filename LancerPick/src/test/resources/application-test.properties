# No fallback to development DB_* credentials.
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://localhost:3306/lancerpick_test?connectionTimeZone=UTC}
spring.datasource.username=${TEST_DB_USERNAME}
spring.datasource.password=${TEST_DB_PASSWORD}

# Tests use a provider double or a local HTTP stub, never the external Toss API.
# Do not inherit the developer's top-up activation or require a personal secret.
toss.topup-enabled=false

# Each cached Spring test context keeps its own Hikari pool. With the default 10 connections per pool,
# 16+ contexts can exceed MySQL max_connections (151) and later tests fail with "Too many connections".
# Keep pools small and let idle connections close; 8 still covers the 4-way concurrency tests.
spring.datasource.hikari.maximum-pool-size=8
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=10000
